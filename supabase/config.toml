# Portal functions run as service role, so identity is verified inside the
# function against the caller's Clerk token, in _shared/clerk-auth.ts. That is
# the authoritative check and does not depend on gateway configuration.
# verify_jwt below only says whether the gateway also rejects unsigned calls
# first; it is never the only thing standing between a caller and another
# member's data.

[functions.systeme-subscribe]
verify_jwt = false

[functions.mailerlite-subscribe]
verify_jwt = false

[functions.send-intake-email]
verify_jwt = false

[functions.send-baseline-email]
verify_jwt = false

[functions.sitemap]
verify_jwt = false

[functions.generate-script]
verify_jwt = false

[functions.generate-portal-script]
verify_jwt = false

[functions.finalize-assessment]
verify_jwt = true

[functions.process-email-queue]
verify_jwt = true

[functions.send-transactional-email]
verify_jwt = true

[functions.preview-transactional-email]
verify_jwt = false

[functions.handle-email-unsubscribe]
verify_jwt = false

[functions.handle-email-suppression]
verify_jwt = false

[functions.telegram-priority-support]
verify_jwt = false

[functions.fire-mailerlite-trigger]
verify_jwt = false

[functions.mailerlite-scheduled-triggers]
verify_jwt = false

[functions.draft-member-content]
verify_jwt = false

[functions.ai-coach]
verify_jwt = false

# Signed by Clerk with Svix headers, not a bearer token
[functions.clerk-webhook]
verify_jwt = false
